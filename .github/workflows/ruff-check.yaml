name: Ruff check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  run_ruff_check:
    name: Ruff check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout assemblyline-mcp
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff
        run: |
          ruff check
          ruff format --check
