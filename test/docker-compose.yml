
services:
  al_ui:
    build:
      context: ../..
      dockerfile: assemblyline-ui/test/Dockerfile
      args:
        - PYTHON_VERSION=${PYTHON_VERSION:-3.14}
    environment:
      - AL_UNSECURED_UI=true
    ports:
      - "5000:5000"
    volumes:
      - ${PATH_REWRITE:-.}/config/:/etc/assemblyline/
      - ${ROOT_REWRITE:-../..}:/opt/alv4/
    working_dir: /opt/alv4/assemblyline-ui/assemblyline_ui/
    command: python3 app.py
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import requests; requests.head(\"http://localhost:5000/healthz/live\", timeout=2).raise_for_status()' || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 3
    extra_hosts:
      - "localhost:host-gateway"

  al_mcp:
    build:
      context: ..
    ports:
      - "8000:8000"
    depends_on:
      al_ui:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "uv run python -c 'import requests; requests.head(\"http://localhost:8000/health\", timeout=2).raise_for_status()' || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 3
    extra_hosts:
      - "localhost:host-gateway"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.2
    environment:
      - xpack.security.enabled=true
      - discovery.type=single-node
      - logger.level=WARN
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - ELASTIC_PASSWORD=devpass
    ports:
      - "9200:9200"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -u elastic:devpass --silent --fail localhost:9200/_cluster/health || exit 1"
        ]
      interval: 30s
      timeout: 30s
      retries: 3

  redis:
    image: redis
    ports:
      - "6380:6379"
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: cccs/nginx-ssl-frontend
    ports:
      - "443:443"
      - "80:80"

  minio:
    image: cgr.dev/chainguard/minio
    environment:
      MINIO_ROOT_USER: al_storage_key
      MINIO_ROOT_PASSWORD: Ch@ngeTh!sPa33w0rd
    ports:
      - "9000:9000"
    command: server /data

# OAuth testing
  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    environment:
      - KC_HEALTH_ENABLED=true
    volumes:
      - ${PATH_REWRITE:-.}/config/keycloak-realm.json:/opt/keycloak/data/import/realm.json
    command: start-dev --import-realm
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "{ printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  pytest:
    image: astral/uv:python3.14-trixie
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - ${PATH_REWRITE:-.}/config/:/etc/assemblyline/
      - ${PATH_REWRITE:-..}:/app
    working_dir: /app
    command: bash -c "uv pip install --system .[test] && uv run pytest -vv --full-trace"
    depends_on:
      al_mcp:
        condition: service_healthy
    extra_hosts:
      - "localhost:host-gateway"
